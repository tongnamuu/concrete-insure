[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "insurelens-nat"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["nvidia-nat==1.9.0", "httpx>=0.28,<1", "packaging>=24", "langchain-core>=1,<2"]
[project.entry-points.'nat.components']
insurelens = "insurelens_nat.register"
[tool.setuptools.packages.find]
where = ["src"]
