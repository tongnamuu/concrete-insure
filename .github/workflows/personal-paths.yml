name: Personal paths
on: [pull_request, push]
permissions:
  contents: read
jobs:
  personal-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Reject personal filesystem paths
        run: python3 scripts/check-personal-paths.py
